<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GMBA Expert Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    #status { padding: 12px; border-radius: 6px; margin-top: 20px; }
    .ok { background: #d4f7d4; color: #14532d; }
    .fail { background: #fddede; color: #7f1d1d; }
    #map { height: 500px; margin-top: 20px; border: 1px solid #ccc; border-radius: 6px; }
    #selection { padding: 12px; margin-top: 12px; background: #eef2ff; border-radius: 6px; display: none; }
  </style>
</head>
<body>
  <h1>GMBA Expert Platform</h1>
 <div id="auth-container">

  <div id="register-box">
    <h3>Create Account</h3>

    <input id="reg-name" placeholder="Full name">
    <br><br>

    <input id="reg-inst" placeholder="Institution">
    <br><br>

    <input id="reg-email" type="email" placeholder="Email">
    <br><br>

    <input id="reg-password" type="password" placeholder="Password">
    <br><br>

    <button onclick="register()">
      Create Account
    </button>
  </div>

  <hr>

  <div id="login-box">
    <h3>Login</h3>

    <input id="login-email" type="email" placeholder="Email">
    <br><br>

    <input id="login-password" type="password" placeholder="Password">
    <br><br>

    <button onclick="login()">
      Login
    </button>
  </div>

  <hr>

  <div id="user-box" style="display:none;">
    <span id="welcome-user"></span>

    <button onclick="logout()">
      Logout
    </button>
  </div>

  <p id="auth-status"></p>

</div>
  <p>Click a mountain range on the map to select it.</p>
  <div id="map"></div>
  <div id="selection"></div>
  <div id="status">Checking connection...</div>

  <!-- This loads the Supabase JavaScript library from a CDN, so we don't need to install anything -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <!-- Leaflet: the mapping library -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>

  <script>
    // ---- MAP SETUP ----
    // Create the map, centered roughly on the world, zoomed out
    const map = L.map('map').setView([20, 0], 2);

    // Add the base map tiles (the actual world imagery/background)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 12
    }).addTo(map);

    let selectedMountain = null; // will hold { id, name } once the expert clicks one
    const selectionEl = document.getElementById('selection');

    // Style for mountain polygons, and a highlighted style for the clicked one
    const defaultStyle = { color: '#2563eb', weight: 1, fillOpacity: 0.15 };
    const selectedStyle = { color: '#dc2626', weight: 2, fillOpacity: 0.4 };

    let geojsonLayer = null;

    function onMountainClick(e) {
      const feature = e.target.feature;

      // Reset all polygons to default style, then highlight only the clicked one
      geojsonLayer.setStyle(defaultStyle);
      e.target.setStyle(selectedStyle);

      selectedMountain = {
        id: feature.properties.GMBA_V2_ID,
        name: feature.properties.MapName
      };

      selectionEl.style.display = 'block';
      selectionEl.textContent = `Selected: ${selectedMountain.name} (ID ${selectedMountain.id})`;
    }

    // Load the mountain boundaries file and add it to the map
    fetch('gmba_mountains.geojson')
      .then(res => res.json())
      .then(data => {
        geojsonLayer = L.geoJSON(data, {
          style: defaultStyle,
          onEachFeature: (feature, layer) => {
            layer.on('click', onMountainClick);
          }
        }).addTo(map);
      })
      .catch(err => {
        selectionEl.style.display = 'block';
        selectionEl.textContent = '⚠️ Could not load mountain boundaries: ' + err.message;
      });
    // ---- END MAP SETUP ----
  </script>

  <script>
const SUPABASE_URL = "https://xwvzlscjqcegzyrpxqby.supabase.co";
const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3dnpsc2NqcWNlZ3p5cnB4cWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTEyNTIsImV4cCI6MjEwNDk2NzI1Mn0.3-nYI2QDIfX4VS6JxUR7I1WmCbE7Wmi9klOwJ1Jn1sA";

const { createClient } = supabase;
const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const statusEl = document.getElementById("status");
const authStatusEl = document.getElementById("auth-status");
const registerBox = document.getElementById("register-box");
const loginBox = document.getElementById("login-box");
const userBox = document.getElementById("user-box");
const welcomeUser = document.getElementById("welcome-user");

async function testConnection() {
  try {
    const { error } = await client.auth.getSession();
    if (error) throw error;
    statusEl.textContent = "✅ Connected to Supabase successfully.";
    statusEl.className = "ok";
  } catch (err) {
    statusEl.textContent = "❌ Connection failed: " + err.message;
    statusEl.className = "fail";
  }
}

// Creates the login account AND the profile row (name + institution) in one step
async function register() {
  const name = document.getElementById("reg-name").value;
  const institution = document.getElementById("reg-inst").value;
  const email = document.getElementById("reg-email").value;
  const password = document.getElementById("reg-password").value;

  if (!name || !institution || !email || !password) {
    authStatusEl.textContent = "Please fill in all fields.";
    return;
  }

  // Step 1: create the login account
  const { data, error } = await client.auth.signUp({ email, password });
  if (error) {
    authStatusEl.textContent = "❌ " + error.message;
    return;
  }

  // Step 2: create the matching profile row with name + institution.
  // data.user exists immediately if email confirmation is turned off (see instructions above).
  if (data.user) {
    const { error: profileError } = await client
      .from("profiles")
      .insert({ id: data.user.id, name, institution });

    if (profileError) {
      authStatusEl.textContent = "Account created, but profile save failed: " + profileError.message;
      return;
    }
  }

  authStatusEl.textContent = "✅ Account created! You're logged in.";
  await refreshAuthUI();
}

async function login() {
  const email = document.getElementById("login-email").value;
  const password = document.getElementById("login-password").value;

  const { error } = await client.auth.signInWithPassword({ email, password });
  if (error) {
    authStatusEl.textContent = "❌ " + error.message;
    return;
  }
  authStatusEl.textContent = "";
  await refreshAuthUI();
}

async function logout() {
  await client.auth.signOut();
  await refreshAuthUI();
}

// Shows either the register/login forms, or the "Welcome, X" box, depending on login state
async function refreshAuthUI() {
  const { data: { session } } = await client.auth.getSession();

  if (session) {
    registerBox.style.display = "none";
    loginBox.style.display = "none";
    userBox.style.display = "block";

    const { data: profile } = await client
      .from("profiles")
      .select("name, institution")
      .eq("id", session.user.id)
      .single();

    welcomeUser.textContent = profile
      ? `Welcome, ${profile.name} (${profile.institution})`
      : `Welcome, ${session.user.email}`;
  } else {
    registerBox.style.display = "block";
    loginBox.style.display = "block";
    userBox.style.display = "none";
  }
}

testConnection();
refreshAuthUI();
</script>

</body>
</html>
